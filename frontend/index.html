<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNPS Reservation Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { forest: { 50: '#f2f7f4', 100: '#e1efe6', 200: '#c4dfd0', 300: '#9bc6ae', 400: '#6ba686', 500: '#478865', 600: '#346c4f', 700: '#2a5640', 800: '#234534', 900: '#1d392c', 950: '#0f2018' }, sand: '#f4f1ea', alert: '#e63946', accent: '#e9c46a' }, fontFamily: { sans: ['Outfit', 'sans-serif'], serif: ['Fraunces', 'serif'] }, boxShadow: { 'brutal': '6px 6px 0px 0px rgba(15, 32, 24, 1)', 'brutal-sm': '4px 4px 0px 0px rgba(15, 32, 24, 1)', 'brutal-hover': '2px 2px 0px 0px rgba(15, 32, 24, 1)' } } } }
    </script>
    <style>
        body { background-color: #f4f1ea; color: #0f2018; }
        .brutal-card { border: 2px solid #0f2018; background: white; box-shadow: 6px 6px 0px 0px rgba(15, 32, 24, 1); transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .brutal-input { border: 2px solid #0f2018; padding: 0.75rem 1rem; width: 100%; background: white; transition: all 0.2s ease; font-family: 'Outfit', sans-serif; }
        .brutal-input:focus { outline: none; box-shadow: 4px 4px 0px 0px rgba(15, 32, 24, 1); transform: translate(-2px, -2px); }
        .brutal-checkbox { appearance: none; width: 1.5rem; height: 1.5rem; border: 2px solid #0f2018; background-color: white; cursor: pointer; position: relative; transition: all 0.1s ease; flex-shrink: 0; }
        .brutal-checkbox:checked { background-color: #0f2018; }
        .brutal-checkbox:checked::after { content: ''; position: absolute; left: 7px; top: 2px; width: 6px; height: 14px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
        .brutal-radio { appearance: none; width: 1.5rem; height: 1.5rem; border: 2px solid #0f2018; border-radius: 50%; background-color: white; cursor: pointer; position: relative; transition: all 0.1s ease; flex-shrink: 0; }
        .brutal-radio:checked::after { content: ''; position: absolute; left: 4px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background-color: #0f2018; }
        .brutal-btn { border: 2px solid #0f2018; font-weight: 600; transition: all 0.1s ease; box-shadow: 4px 4px 0px 0px rgba(15, 32, 24, 1); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .brutal-btn:active:not(:disabled) { box-shadow: 0px 0px 0px 0px rgba(15, 32, 24, 1); transform: translate(4px, 4px); }
        .brutal-btn:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: 0px 0px 0px 0px rgba(15, 32, 24, 1); transform: translate(4px, 4px); }
        .brutal-btn-primary { background-color: #0f2018; color: white; }
        .brutal-btn-secondary { background-color: #e9c46a; color: #0f2018; }
        .brutal-btn-outline { background-color: white; color: #0f2018; }
        .brutal-btn-danger { background-color: #e63946; color: white; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #f4f1ea; border-left: 2px solid #0f2018; }
        ::-webkit-scrollbar-thumb { background: #0f2018; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
        .toast-enter { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast-exit { animation: slideOut 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">
    <div id="toast-container" class="fixed bottom-6 right-6 z-[100] flex flex-col gap-3 pointer-events-none"></div>
    <header class="sticky top-0 z-40 bg-sand/90 backdrop-blur-md border-b-2 border-forest-950">
        <div class="max-w-6xl mx-auto px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-forest-950 text-white flex items-center justify-center font-serif font-bold text-xl border-2 border-forest-950">K</div>
                <h1 class="font-serif text-2xl font-bold tracking-tight text-forest-950">KNPS Monitor</h1>
            </div>
            <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                <button id="btn-quick-search-page" class="brutal-btn brutal-btn-secondary px-5 py-2.5 text-sm w-full sm:w-auto"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg> Quick Search</button>
                <button id="btn-clear-all-history" class="brutal-btn brutal-btn-danger px-5 py-2.5 text-sm w-full sm:w-auto"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg> Clear All History</button>
                <button id="btn-test" class="brutal-btn brutal-btn-outline px-5 py-2.5 text-sm w-full sm:w-auto"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> Test Now</button>
            </div>
        </div>
    </header>
    <main class="flex-grow max-w-6xl mx-auto w-full px-4 sm:px-6 py-8 sm:py-12">
        <div id="dashboard-view" class="space-y-8">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div><h2 class="font-serif text-3xl font-bold text-forest-950">Your Monitors</h2><p class="text-forest-700 mt-1">Manage reservation alerts (up to 10)</p></div>
                <button id="btn-add-setting" class="brutal-btn brutal-btn-primary px-6 py-3 text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg> Add New Setting</button>
            </div>
            <div id="settings-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"><div class="col-span-full text-center py-12 text-forest-700 hidden" id="empty-state">No monitors configured yet.</div></div>
        </div>
    </main>
    <div id="setting-modal" class="fixed inset-0 z-50 hidden bg-forest-950/80 backdrop-blur-sm overflow-y-auto">
        <div class="min-h-screen px-4 text-center flex items-center justify-center py-10">
            <div class="inline-block w-full max-w-5xl text-left align-middle transition-all transform bg-sand brutal-card relative">
                <div class="flex justify-between items-center p-6 border-b-2 border-forest-950 bg-white sticky top-0 z-10"><h3 class="font-serif text-2xl font-bold text-forest-950" id="modal-title">Setting</h3><button id="btn-close-modal" class="text-forest-950 hover:text-alert transition-colors"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button></div>
                <div class="p-6 sm:p-8"><form id="settings-form" class="grid grid-cols-1 lg:grid-cols-12 gap-8"><input type="hidden" id="setting_id" name="id">
                        <div class="lg:col-span-5 flex flex-col gap-8"><section class="brutal-card p-6"><h2 class="font-serif text-xl font-bold mb-5">Basic Info</h2><div class="space-y-5"><div><label class="block text-sm font-bold mb-2 uppercase text-forest-800">Name</label><input type="text" id="name" name="name" class="brutal-input" required></div><label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" id="is_active" name="is_active" class="brutal-checkbox" checked><span class="font-bold text-sm uppercase text-forest-800">Active</span></label><label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" id="include_waiting" name="include_waiting" class="brutal-checkbox" checked><span class="font-bold text-sm uppercase text-forest-800">Waiting List</span></label></div></section>
                            <section class="brutal-card p-6"><h2 class="font-serif text-xl font-bold mb-5">Schedule</h2><div class="mb-6 flex gap-4 p-4 border-2 border-forest-950/20 bg-white"><label class="flex items-center gap-3 cursor-pointer"><input type="radio" name="date_mode" value="weekday" class="brutal-radio" checked><span class="text-sm font-bold uppercase">Weekday</span></label><label class="flex items-center gap-3 cursor-pointer"><input type="radio" name="date_mode" value="absolute" class="brutal-radio"><span class="text-sm font-bold uppercase">Absolute</span></label></div>
                                <div id="weekday-section" class="space-y-6"><div><label class="block text-sm font-bold mb-2 uppercase text-forest-800">Weeks Ahead</label><input type="number" id="weeks_ahead" name="weeks_ahead" value="4" class="brutal-input"></div><div class="pt-4 border-t-2 border-forest-950/10"><label class="block text-sm font-bold mb-3 uppercase text-forest-800">Days</label><div class="flex flex-col gap-3"><label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" name="selected_days" value="Fri" class="brutal-checkbox"><span>Friday</span></label><label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" name="selected_days" value="Sat" class="brutal-checkbox"><span>Saturday</span></label><label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" name="selected_days" value="Sun" class="brutal-checkbox"><span>Sunday</span></label></div></div></div>
                                <div id="absolute-section" class="space-y-5 hidden"><div><label class="block text-sm font-bold mb-2 uppercase text-forest-800">Start Date</label><input type="date" id="start_date" name="start_date" class="brutal-input"></div><div><label class="block text-sm font-bold mb-2 uppercase text-forest-800">End Date</label><input type="date" id="end_date" name="end_date" class="brutal-input"></div></div>
                                <div class="pt-6 mt-4 border-t-2 border-forest-950/10"><label class="block text-sm font-bold mb-2 uppercase text-forest-800">Cooldown (days)</label><input type="number" id="cooldown_days" name="cooldown_days" value="3" min="0" max="30" class="brutal-input"></div></section></div>
                        <div class="lg:col-span-7 flex flex-col gap-8"><section class="brutal-card p-6"><h2 class="font-serif text-xl font-bold mb-5">Facility Types</h2><div class="grid grid-cols-1 sm:grid-cols-3 gap-4"><label class="flex items-center gap-3 p-3 border-2 border-forest-950/20 cursor-pointer bg-sand/50"><input type="checkbox" name="selected_types" value="특화야영장" class="brutal-checkbox"><span class="font-bold">특화</span></label><label class="flex items-center gap-3 p-3 border-2 border-forest-950/20 cursor-pointer bg-sand/50"><input type="checkbox" name="selected_types" value="카라반" class="brutal-checkbox"><span class="font-bold">카라반</span></label><label class="flex items-center gap-3 p-3 border-2 border-forest-950/20 cursor-pointer bg-sand/50"><input type="checkbox" name="selected_types" value="자동차야영장" class="brutal-checkbox"><span class="font-bold">자동차</span></label></div></section>
                            <section class="brutal-card p-6"><div class="flex justify-between items-end mb-6"><h2 class="font-serif text-xl font-bold">Parks</h2><button type="button" id="btn-select-all-parks" class="text-xs font-bold uppercase underline">Select All</button></div><div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-x-4 gap-y-3" id="parks-container"></div></section>
                            <section class="brutal-card p-6 bg-forest-950 text-sand"><h2>Telegram Integration</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div><label class="block text-xs font-bold mb-2 text-forest-300">Bot Token</label><input type="password" id="telegram_bot_token" class="brutal-input bg-forest-900 border-forest-700 text-white"></div><div><label class="block text-xs font-bold mb-2 text-forest-300">Chat ID</label><input type="text" id="telegram_chat_id" class="brutal-input bg-forest-900 border-forest-700 text-white"></div></div></section></div></form></div>
                <div class="p-6 border-t-2 border-forest-950 bg-white flex justify-end gap-4 sticky bottom-0 z-10"><button id="btn-cancel-modal-footer" class="brutal-btn brutal-btn-outline px-6 py-3">Cancel</button><button id="btn-clear-history" class="brutal-btn brutal-btn-secondary px-6 py-3 hidden">Clear History</button><button id="btn-save-setting" class="brutal-btn brutal-btn-primary px-8 py-3">Save</button></div>
            </div></div></div>
    <script>
        const PARKS = ['지리산', '경주', '계룡산', '내장산', '가야산', '덕유산', '오대산', '주왕산', '태안해안', '다도해해상', '변산반도', '월출산', '소백산', '월악산', '북한산', '치악산', '한려해상', '속리산', '설악산', '무등산', '태백산'];
        let settingsList = []; const form = document.getElementById('settings-form'); const parksContainer = document.getElementById('parks-container'); const btnTest = document.getElementById('btn-test'); const btnSelectAllParks = document.getElementById('btn-select-all-parks'); const toastContainer = document.getElementById('toast-container'); const btnClearAllHistory = document.getElementById('btn-clear-all-history'); const btnQuickSearchPage = document.getElementById('btn-quick-search-page'); const settingsListContainer = document.getElementById('settings-list'); const emptyState = document.getElementById('empty-state'); const btnAddSetting = document.getElementById('btn-add-setting'); const modal = document.getElementById('setting-modal'); const modalTitle = document.getElementById('modal-title'); const btnCloseModal = document.getElementById('btn-close-modal'); const btnCancelModalFooter = document.getElementById('btn-cancel-modal-footer'); const btnClearHistory = document.getElementById('btn-clear-history'); const btnSaveSetting = document.getElementById('btn-save-setting'); const radioDateMode = document.querySelectorAll('input[name="date_mode"]'); const weekdaySection = document.getElementById('weekday-section'); const absoluteSection = document.getElementById('absolute-section');
        document.addEventListener('DOMContentLoaded', () => { renderParks(); fetchSettings(); setupEventListeners(); });
        function renderParks() { parksContainer.innerHTML = PARKS.map(p => `<label class="flex items-center gap-2 py-1"><input type="checkbox" name="selected_parks" value="${p}" class="brutal-checkbox w-5 h-5"><span class="text-sm">${p}</span></label>`).join(''); }
        function setupEventListeners() {
            btnTest.addEventListener('click', handleTest); btnClearAllHistory.addEventListener('click', handleClearAllHistory); btnQuickSearchPage.addEventListener('click', () => window.open('search.html', '_blank')); btnAddSetting.addEventListener('click', () => openModal()); btnCloseModal.addEventListener('click', closeModal); btnCancelModalFooter.addEventListener('click', closeModal); btnClearHistory.addEventListener('click', handleClearHistory); btnSaveSetting.addEventListener('click', handleSave); radioDateMode.forEach(r => r.addEventListener('change', e => toggleDateMode(e.target.value))); btnSelectAllParks.addEventListener('click', () => { const cbs = document.querySelectorAll('input[name="selected_parks"]'); const all = Array.from(cbs).every(c => c.checked); cbs.forEach(c => c.checked = !all); btnSelectAllParks.textContent = all ? 'Select All' : 'Deselect All'; });
        }
        function toggleDateMode(m) { if (m === 'weekday') { weekdaySection.classList.remove('hidden'); absoluteSection.classList.add('hidden'); } else { weekdaySection.classList.add('hidden'); absoluteSection.classList.remove('hidden'); } }
        async function fetchSettings() { try { const r = await fetch('/api/settings/all'); if (!r.ok) throw new Error(); settingsList = await r.json(); renderSettingsList(); } catch (e) { showToast('Error loading settings', 'error'); } }
        function renderSettingsList() { settingsListContainer.innerHTML = ''; if (!settingsList.length) { emptyState.classList.remove('hidden'); return; } emptyState.classList.add('hidden'); settingsList.forEach(s => { const c = document.createElement('div'); c.className = `brutal-card p-6 flex flex-col h-full relative ${!s.is_active ? 'opacity-75 bg-sand/30' : ''}`; let dInfo = s.date_mode === 'absolute' ? `${s.start_date || ''} to ${s.end_date || ''}` : `${s.weeks_ahead} wks (${s.selected_days ? s.selected_days.join(',') : ''})`; c.innerHTML = `<div class="flex justify-between mb-4"><h3 class="font-serif text-xl font-bold truncate">${s.name}</h3><span class="px-2 py-1 border-2 border-forest-950 text-xs font-bold bg-white">${s.is_active ? 'Active' : 'Off'}</span></div><div class="space-y-3 mb-6"><div class="text-sm">Schedule: ${dInfo}</div><div class="text-sm">Parks: ${s.selected_parks ? s.selected_parks.length : 0}</div></div><div class="flex gap-3 mt-auto pt-4 border-t-2 border-forest-950/10"><button onclick="toggleActive('${s.id}', ${!s.is_active})" class="brutal-btn px-4 py-2 text-sm">Status</button><button onclick="editSetting('${s.id}')" class="brutal-btn brutal-btn-outline flex-1">Edit</button><button onclick="deleteSetting('${s.id}')" class="brutal-btn brutal-btn-danger px-4 py-2 text-sm">Del</button></div>`; settingsListContainer.appendChild(c); }); }
        function openModal(id = null) { form.reset(); document.getElementById('setting_id').value = ''; document.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false); document.getElementById('is_active').checked = true; document.getElementById('include_waiting').checked = true; document.querySelector('input[name="date_mode"][value="weekday"]').checked = true; toggleDateMode('weekday'); if (id) { modalTitle.textContent = 'Edit Setting'; btnClearHistory.classList.remove('hidden'); const s = settingsList.find(x => x.id == id); if (s) populateForm(s); } else { modalTitle.textContent = 'Add New Setting'; } modal.classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
        function closeModal() { modal.classList.add('hidden'); btnClearHistory.classList.add('hidden'); document.body.style.overflow = ''; } window.editSetting = id => openModal(id); window.deleteSetting = async id => { if (confirm('Sure?')) { const r = await fetch(`/api/settings/${id}`, { method: 'DELETE' }); if (r.ok) { showToast('Deleted'); fetchSettings(); } } }; window.toggleActive = async (id, s) => { const r = await fetch(`/api/settings/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ is_active: s }) }); if (r.ok) { showToast('Updated'); fetchSettings(); } };
        function populateForm(s) { document.getElementById('setting_id').value = s.id; ['name', 'weeks_ahead', 'start_date', 'end_date', 'cooldown_days', 'telegram_bot_token', 'telegram_chat_id'].forEach(k => { if (document.getElementById(k) && s[k]) document.getElementById(k).value = s[k]; }); if (s.date_mode) { document.querySelector(`input[name="date_mode"][value="${s.date_mode}"]`).checked = true; toggleDateMode(s.date_mode); } ['selected_days', 'selected_types', 'selected_parks'].forEach(g => { if (s[g]) document.querySelectorAll(`input[name="${g}"]`).forEach(c => c.checked = s[g].includes(c.value)); }); }
        function getFormData() { const d = { name: document.getElementById('name').value, is_active: document.getElementById('is_active').checked, include_waiting: document.getElementById('include_waiting').checked, date_mode: document.querySelector('input[name="date_mode"]:checked').value, weeks_ahead: parseInt(document.getElementById('weeks_ahead').value), start_date: document.getElementById('start_date').value, end_date: document.getElementById('end_date').value, cooldown_days: parseInt(document.getElementById('cooldown_days').value), telegram_bot_token: document.getElementById('telegram_bot_token').value, telegram_chat_id: document.getElementById('telegram_chat_id').value, selected_days: [], selected_types: [], selected_parks: [] }; ['selected_days', 'selected_types', 'selected_parks'].forEach(g => d[g] = Array.from(document.querySelectorAll(`input[name="${g}"]:checked`)).map(c => c.value)); return d; }
        async function handleSave(e) { e.preventDefault(); const id = document.getElementById('setting_id').value; try { const r = await fetch(id ? `/api/settings/${id}` : '/api/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(getFormData()) }); if (r.ok) { showToast('Saved'); closeModal(); fetchSettings(); } else { const err = await r.json().catch(() => ({})); showToast(err.error || `Save failed (${r.status})`, 'error'); } } catch (e) { showToast('Network error', 'error'); } }
        async function handleTest(e) { e.preventDefault(); const r = await fetch('/api/check?test=true', { method: 'POST' }); if (r.ok) showToast('Test triggered'); } async function handleClearAllHistory(e) { e.preventDefault(); if (confirm('Clear all?')) { const r = await fetch('/api/history', { method: 'DELETE' }); if (r.ok) showToast('Cleared'); } } async function handleClearHistory(e) { e.preventDefault(); const id = document.getElementById('setting_id').value; if (id && confirm('Sure?')) { const r = await fetch(`/api/settings/${id}/history`, { method: 'DELETE' }); if (r.ok) showToast('Cleared'); } }
        function showToast(m, t = 'success') { const toast = document.createElement('div'); toast.className = `toast-enter flex items-center gap-3 px-4 py-3 border-2 border-forest-950 shadow-brutal pointer-events-auto ${t === 'success' ? 'bg-forest-950' : 'bg-alert'} text-white`; toast.innerHTML = `<span class="font-medium text-sm">${m}</span>`; toastContainer.appendChild(toast); setTimeout(() => { toast.classList.replace('toast-enter', 'toast-exit'); toast.addEventListener('animationend', () => toast.remove()); }, 3000); }
    </script>
</body></html>
