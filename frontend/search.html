<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Search | KNPS Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { forest: { 50: '#f2f7f4', 100: '#e1efe6', 200: '#c4dfd0', 300: '#9bc6ae', 400: '#6ba686', 500: '#478865', 600: '#346c4f', 700: '#2a5640', 800: '#234534', 900: '#1d392c', 950: '#0f2018' }, sand: '#f4f1ea', alert: '#e63946', accent: '#e9c46a' }, fontFamily: { sans: ['Outfit', 'sans-serif'], serif: ['Fraunces', 'serif'] }, boxShadow: { 'brutal': '6px 6px 0px 0px rgba(15, 32, 24, 1)', 'brutal-sm': '4px 4px 0px 0px rgba(15, 32, 24, 1)' } } } }
    </script>
    <style>
        body { background-color: #f4f1ea; color: #0f2018; font-family: 'Outfit', sans-serif; }
        .brutal-card { border: 2px solid #0f2018; background: white; box-shadow: 6px 6px 0px 0px rgba(15, 32, 24, 1); }
        .brutal-input { border: 2px solid #0f2018; padding: 0.75rem 1rem; width: 100%; background: white; transition: all 0.2s ease; }
        .brutal-btn { border: 2px solid #0f2018; font-weight: 600; transition: all 0.1s ease; box-shadow: 4px 4px 0px 0px rgba(15, 32, 24, 1); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .brutal-btn:active { box-shadow: 0px 0px 0px 0px rgba(15, 32, 24, 1); transform: translate(4px, 4px); }
        .brutal-checkbox { appearance: none; width: 1.25rem; height: 1.25rem; border: 2px solid #0f2018; background-color: white; cursor: pointer; position: relative; }
        .brutal-checkbox:checked { background-color: #0f2018; }
        .brutal-checkbox:checked::after { content: ''; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
        .brutal-radio { appearance: none; width: 1.25rem; height: 1.25rem; border: 2px solid #0f2018; border-radius: 50%; background-color: white; cursor: pointer; position: relative; }
        .brutal-radio:checked::after { content: ''; position: absolute; left: 4px; top: 4px; width: 8px; height: 8px; border-radius: 50%; background-color: #0f2018; }
    </style>
</head>
<body class="min-h-screen p-6 sm:p-12">
    <div class="max-w-5xl mx-auto">
        <header class="mb-10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-6">
            <div><h1 class="font-serif text-4xl font-bold text-forest-950 tracking-tight">Quick Availability Search</h1><p class="text-forest-700 mt-2 font-medium uppercase tracking-widest text-xs">Real-time campsite lookup</p></div>
            <button onclick="window.close()" class="brutal-btn bg-white px-6 py-3 text-sm">Close Tab</button>
        </header>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-12">
            <div class="lg:col-span-1 space-y-6">
                <section class="brutal-card p-6 bg-white"><h3 class="font-serif text-xl font-bold mb-5 flex items-center gap-2">Schedule</h3>
                    <div class="flex flex-col gap-4 mb-6"><label class="flex items-center gap-3 cursor-pointer"><input type="radio" name="date_mode" value="weekday" class="brutal-radio" checked><span class="text-sm font-bold uppercase tracking-wider">Weekday Mode</span></label><label class="flex items-center gap-3 cursor-pointer"><input type="radio" name="date_mode" value="absolute" class="brutal-radio"><span class="text-sm font-bold uppercase tracking-wider">Absolute Dates</span></label></div>
                    <div id="weekday-ui" class="space-y-4"><div><label class="block text-[10px] font-bold uppercase mb-1 text-forest-600">Weeks Ahead</label><input type="number" id="weeks_ahead" value="4" min="1" max="10" class="brutal-input py-2"></div><div class="flex flex-wrap gap-3"><label class="flex items-center gap-2 cursor-pointer bg-sand/50 p-2 border-2 border-forest-950/10"><input type="checkbox" name="days" value="Fri" class="brutal-checkbox"><span class="text-xs font-bold">FRI</span></label><label class="flex items-center gap-2 cursor-pointer bg-sand/50 p-2 border-2 border-forest-950/10"><input type="checkbox" name="days" value="Sat" class="brutal-checkbox" checked><span class="text-xs font-bold">SAT</span></label><label class="flex items-center gap-2 cursor-pointer bg-sand/50 p-2 border-2 border-forest-950/10"><input type="checkbox" name="days" value="Sun" class="brutal-checkbox" checked><span class="text-xs font-bold">SUN</span></label></div></div>
                    <div id="absolute-ui" class="space-y-4 hidden"><div><label class="block text-[10px] font-bold uppercase mb-1 text-forest-600">Start Date</label><input type="date" id="start_date" class="brutal-input py-2"></div><div><label class="block text-[10px] font-bold uppercase mb-1 text-forest-600">End Date</label><input type="date" id="end_date" class="brutal-input py-2"></div></div>
                </section>
                <section class="brutal-card p-6 bg-white"><h3 class="font-serif text-xl font-bold mb-5 flex items-center gap-2">Facility</h3><select id="facility_type" class="brutal-input"><option value="">All Facilities</option><option value="특화야영장">특화야영장</option><option value="카라반">카라반</option><option value="자동차야영장">자동차야영장</option></select></section>
                <button id="btn-search" class="brutal-btn w-full bg-forest-950 text-white py-4 text-lg">Search Now</button></div>
            <div class="lg:col-span-2"><div id="results-container" class="space-y-6"><div class="brutal-card p-12 text-center bg-white/50 border-dashed border-2"><p class="text-forest-600 italic">Configure search and click "Search Now".</p></div></div></div>
        </div></div>
    <script>
        const dateModeRadios = document.querySelectorAll('input[name="date_mode"]'); const weekdayUi = document.getElementById('weekday-ui'); const absoluteUi = document.getElementById('absolute-ui'); const btnSearch = document.getElementById('btn-search'); const resultsContainer = document.getElementById('results-container');
        dateModeRadios.forEach(radio => { radio.addEventListener('change', (e) => { if (e.target.value === 'weekday') { weekdayUi.classList.remove('hidden'); absoluteUi.classList.add('hidden'); } else { weekdayUi.classList.add('hidden'); absoluteUi.classList.remove('hidden'); } }); });
        btnSearch.addEventListener('click', async () => { const mode = document.querySelector('input[name="date_mode"]:checked').value; const facility = document.getElementById('facility_type').value; let dates = []; if (mode === 'weekday') { const weeks = parseInt(document.getElementById('weeks_ahead').value); const days = Array.from(document.querySelectorAll('input[name="days"]:checked')).map(cb => cb.value); if (days.length === 0) { alert('Select days.'); return; } dates = calculateWeekdayDates(weeks, days); } else { const start = document.getElementById('start_date').value; const end = document.getElementById('end_date').value; if (!start || !end) { alert('Select dates.'); return; } dates = calculateRangeDates(start, end); } if (dates.length === 0) { alert('No valid dates.'); return; } performSearch(dates, facility); });
        function calculateWeekdayDates(weeks, days) { const result = []; const dayMap = { 'Sun': 0, 'Mon': 1, 'Tue': 2, 'Wed': 3, 'Thu': 4, 'Fri': 5, 'Sat': 6 }; const targetDayNums = days.map(d => dayMap[d]); for (let i = 0; i < weeks * 7; i++) { const d = new Date(); d.setDate(d.getDate() + i); if (targetDayNums.includes(d.getDay())) result.push(d.toISOString().split('T')[0]); } return result; }
        function calculateRangeDates(start, end) { const result = []; let curr = new Date(start); const stop = new Date(end); while (curr <= stop) { result.push(curr.toISOString().split('T')[0]); curr.setDate(curr.getDate() + 1); } return result; }
        async function performSearch(dates, facility) { btnSearch.disabled = true; btnSearch.textContent = 'Searching...'; resultsContainer.innerHTML = '<div class="animate-pulse flex flex-col gap-4"><div class="h-12 bg-forest-200 border-2 border-forest-950 w-full"></div><div class="h-48 bg-white border-2 border-forest-950 w-full"></div></div>'; try { const response = await fetch(`/api/search?dates=${dates.join(',')}&types=${facility || ''}`); const data = await response.json(); resultsContainer.innerHTML = ''; if (!Array.isArray(data) || data.length === 0) { resultsContainer.innerHTML = '<div class="brutal-card p-12 text-center bg-white"><h2 class="font-serif text-2xl font-bold">No availability found</h2></div>'; return; } const grouped = data.reduce((acc, curr) => { if (!acc[curr.park_name]) acc[curr.park_name] = []; acc[curr.park_name].push(curr); return acc; }, {}); Object.entries(grouped).forEach(([park, sites]) => { const parkDiv = document.createElement('div'); parkDiv.className = 'brutal-card overflow-hidden mb-8'; let sitesHtml = sites.map(site => `<div class="p-4 border-b last:border-b-0 border-forest-950/10 flex justify-between items-center bg-sand/20"><div><h4 class="font-bold">${site.campsite_name}</h4><div class="flex gap-2 mt-1"><span class="text-[10px] font-bold px-1.5 py-0.5 bg-forest-100 text-forest-700 border border-forest-200">${site.facility_type}</span><span class="text-[10px] font-bold px-1.5 py-0.5 bg-accent/20 text-forest-800 border border-accent/30">${site.date}</span></div></div><div class="flex gap-6"><div class="text-right"><p class="text-[9px] font-bold uppercase text-forest-400">Avail</p><p class="text-xl font-serif font-bold ${site.available_count > 0 ? 'text-forest-600' : 'text-forest-200'}">${site.available_count}</p></div><div class="text-right"><p class="text-[9px] font-bold uppercase text-forest-400">Wait</p><p class="text-xl font-serif font-bold ${site.waiting_count > 0 ? 'text-accent' : 'text-forest-200'}">${site.waiting_count}</p></div></div></div>`).join(''); parkDiv.innerHTML = `<div class="bg-forest-950 text-white p-4 font-serif text-xl font-bold flex justify-between items-center"><span>${park}</span><span class="text-xs font-sans px-2 py-1 bg-accent text-forest-950 border border-forest-950">${sites.length} items</span></div><div class="divide-y divide-forest-950/10">${sitesHtml}</div>`; resultsContainer.appendChild(parkDiv); }); } catch (error) { resultsContainer.innerHTML = '<div class="brutal-card p-8 bg-alert text-white"><h2>Search failed</h2></div>'; } finally { btnSearch.disabled = false; btnSearch.textContent = 'Search Now'; } }
    </script>
</body></html>
