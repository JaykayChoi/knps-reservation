<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Search | KNPS Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { forest: { 50: '#f2f7f4', 100: '#e1efe6', 200: '#c4dfd0', 300: '#9bc6ae', 400: '#6ba686', 500: '#478865', 600: '#346c4f', 700: '#2a5640', 800: '#234534', 900: '#1d392c', 950: '#0f2018' }, sand: '#f4f1ea', alert: '#e63946', accent: '#e9c46a' }, fontFamily: { sans: ['Outfit', 'sans-serif'], serif: ['Fraunces', 'serif'] }, boxShadow: { 'brutal': '6px 6px 0px 0px rgba(15, 32, 24, 1)', 'brutal-sm': '4px 4px 0px 0px rgba(15, 32, 24, 1)' } } } }
    </script>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen p-6 sm:p-12">
    <div class="max-w-5xl mx-auto">
        <header class="mb-10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-6">
            <div><h1 class="font-serif text-4xl font-bold text-forest-950 tracking-tight">Quick Availability Search</h1><p class="text-forest-700 mt-2 font-medium uppercase tracking-widest text-xs">Real-time campsite lookup</p></div>
            <button onclick="window.close()" class="brutal-btn bg-white px-6 py-3 text-sm">Close Tab</button>
        </header>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-12">
            <div class="lg:col-span-1 space-y-6">
                <section class="brutal-card p-6 bg-white"><h3 class="font-serif text-xl font-bold mb-5 flex items-center gap-2">Schedule</h3>
                    <div class="flex flex-col gap-4 mb-6"><label class="flex items-center gap-3 cursor-pointer"><input type="radio" name="date_mode" value="weekday" class="brutal-radio" checked><span class="text-sm font-bold uppercase tracking-wider">Weekday Mode</span></label><label class="flex items-center gap-3 cursor-pointer"><input type="radio" name="date_mode" value="absolute" class="brutal-radio"><span class="text-sm font-bold uppercase tracking-wider">Absolute Dates</span></label></div>
                    <div id="weekday-ui" class="space-y-4"><div><label class="block text-[10px] font-bold uppercase mb-1 text-forest-600">Weeks Ahead</label><input type="number" id="weeks_ahead" value="4" min="1" max="10" class="brutal-input py-2"></div><div class="flex flex-wrap gap-3"><label class="flex items-center gap-2 cursor-pointer bg-sand/50 p-2 border-2 border-forest-950/10"><input type="checkbox" name="days" value="Fri" class="brutal-checkbox"><span class="text-xs font-bold">FRI</span></label><label class="flex items-center gap-2 cursor-pointer bg-sand/50 p-2 border-2 border-forest-950/10"><input type="checkbox" name="days" value="Sat" class="brutal-checkbox" checked><span class="text-xs font-bold">SAT</span></label><label class="flex items-center gap-2 cursor-pointer bg-sand/50 p-2 border-2 border-forest-950/10"><input type="checkbox" name="days" value="Sun" class="brutal-checkbox" checked><span class="text-xs font-bold">SUN</span></label></div></div>
                    <div id="absolute-ui" class="space-y-4 hidden"><div><label class="block text-[10px] font-bold uppercase mb-1 text-forest-600">Start Date</label><input type="date" id="start_date" class="brutal-input py-2"></div><div><label class="block text-[10px] font-bold uppercase mb-1 text-forest-600">End Date</label><input type="date" id="end_date" class="brutal-input py-2"></div></div>
                </section>
                <section class="brutal-card p-6 bg-white"><h3 class="font-serif text-xl font-bold mb-5 flex items-center gap-2">Facility</h3><select id="facility_type" class="brutal-input"><option value="">All Facilities</option><option value="특화야영장">특화야영장</option><option value="카라반">카라반</option><option value="자동차야영장">자동차야영장</option></select></section>
                <button id="btn-search" class="brutal-btn w-full bg-forest-950 text-white py-4 text-lg">Search Now</button></div>
            <div class="lg:col-span-2"><div id="results-container" class="space-y-6"><div class="brutal-card p-12 text-center bg-white/50 border-dashed border-2"><p class="text-forest-600 italic">Configure search and click "Search Now".</p></div></div></div>
        </div></div>
    <script type="module" src="/js/search.js"></script>
</body></html>
